name: votemanager

x-app: &app
  build: .
  image: votemanager-sitzrechner:local
  environment:
    DATABASE_URL: postgres://votemanager:votemanager@postgres:5432/votemanager
    TZ: Europe/Berlin
  depends_on:
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: votemanager
      POSTGRES_USER: votemanager
      POSTGRES_PASSWORD: votemanager
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U votemanager -d votemanager]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  migrate:
    build: .
    image: votemanager-sitzrechner:local
    command: npm run migrieren
    environment:
      DATABASE_URL: postgres://votemanager:votemanager@postgres:5432/votemanager
    depends_on:
      postgres:
        condition: service_healthy
    restart: no

  web:
    <<: *app
    ports:
      - 3000:3000
    healthcheck:
      test: [CMD-SHELL, wget -q -O- http://127.0.0.1:3000/api/ready >/dev/null]
      interval: 5s
      timeout: 2s
      retries: 30

  poller:
    <<: *app
    command: npm run poller
    profiles: [live]
    environment:
      DATABASE_URL: postgres://votemanager:votemanager@postgres:5432/votemanager
      CRAWLER_CONTACT: ${CRAWLER_CONTACT:?CRAWLER_CONTACT muss gesetzt sein}
      METRICS_PORT: 9090
    ports:
      - 9090:9090
    healthcheck:
      test: [CMD-SHELL, wget -q -O- http://127.0.0.1:9090/metrics >/dev/null]
      interval: 10s
      timeout: 2s
      retries: 30

  probe:
    <<: *app
    command:
      - npm
      - run
      - poller
      - --
      - --regionen=03355,05334
      - --wahltage=20210912,20250914
      - --bis-leer
      - --probe-pruefen
    profiles: [probe]
    depends_on:
      web:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://votemanager:votemanager@postgres:5432/votemanager
      CRAWLER_CONTACT: ${CRAWLER_CONTACT:?CRAWLER_CONTACT muss gesetzt sein}
      POLLER_REQUESTS_PER_SECOND: 5
      POLLER_PARALLEL_PER_HOST: 2
    restart: no

volumes:
  postgres-data:
