name: Image
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ghcr verlangt Kleinschreibung, der Owner-Name hat Großbuchstaben.
      - id: name
        run: echo "bild=ghcr.io/${OWNER,,}/votemanager" >> "$GITHUB_OUTPUT"
        env: { OWNER: "${{ github.repository_owner }}" }
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # SHA = unveränderliche Bauhistorie, main = beweglicher Zeiger für Flux.
          tags: |
            ${{ steps.name.outputs.bild }}:${{ github.sha }}
            ${{ steps.name.outputs.bild }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Digest in die Zusammenfassung
        run: |
          {
            echo "## Image"
            echo '```'
            echo "${{ steps.name.outputs.bild }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo "Deployen per Digest:"
            echo '```'
            echo "helm upgrade --install votemanager helm/votemanager -n votemanager \\"
            echo "  --set image.digest=${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
