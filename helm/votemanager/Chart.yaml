apiVersion: v2
name: votemanager
description: VoteManager result viewer and poller
type: application
# Diese Zahl ist Auskunft, kein Auslöser: die HelmRelease bezieht den Chart mit
# reconcileStrategy: Revision und packt ihn bei jedem Commit neu. Ein Rollout
# hängt also nicht mehr daran, dass jemand hier hochzählt.
#
# Vorher tat er das (ChartVersion), und zweimal blieb dadurch eine
# Chart-Änderung im Repo stehen, ohne im Cluster anzukommen: die angehobenen
# PostgreSQL-Grenzen (1500m im Repo, 1000m im Cluster) und der Mount der
# Rechtstexte-ConfigMap, weshalb /impressum und /datenschutz leer blieben.
# Trotzdem weiter mitzählen — die Version sagt, welcher Stand läuft.
#
# 0.2.0: PostgreSQL-Ressourcen über database.resources konfigurierbar und
# angehoben, web-Limit von 500m auf 1, database.poolSize durchgereicht.
# 0.3.0: Rechtstexte-ConfigMap als Volume und RECHTSTEXTE_PFAD im web-Pod.
version: 0.3.0
appVersion: "0.1.0"
