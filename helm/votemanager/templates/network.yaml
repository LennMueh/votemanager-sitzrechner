apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
  labels: {{- include "votemanager.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/component: web, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-poller
  labels: {{- include "votemanager.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/component: poller, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: metrics, port: 9090, targetPort: metrics }]
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations: {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ .Release.Name }}-web, port: { name: http } } }
{{- end }}
