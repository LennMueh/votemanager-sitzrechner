{{- if .Values.database.bundled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-database
  labels:
    {{- include "votemanager.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ include "votemanager.databaseUrl" . | quote }}
  postgres-password: {{ required "database.password is required when database.bundled=true" .Values.database.password | quote }}
{{- else if not .Values.database.existingSecret }}
{{- fail "database.existingSecret is required when database.bundled=false" }}
{{- end }}
