image:
  repository: ghcr.io/lennmueh/votemanager
  tag: latest
  # Digest gewinnt gegen tag; wird aus der Job-Summary des Image-Workflows gesetzt.
  digest: ""
  pullPolicy: IfNotPresent

metrics:
  serviceMonitor:
    # Braucht die Prometheus-Operator-CRD; ohne Operator auf false setzen.
    enabled: true
    interval: 30s
    labels: {}

crawler:
  contact: ""
  backfill: false

database:
  bundled: true
  name: votemanager
  user: votemanager
  # Nur noetig, wenn bundled=true UND kein existingSecret gesetzt ist.
  password: ""
  # Gesetzt: Chart erzeugt kein eigenes Secret, sondern liest dieses. Gilt auch
  # bei bundled=true; das Secret muss dann beide Keys tragen: den Key aus
  # secretKey (Verbindungs-URL) und postgres-password fuer den DB-Container.
  existingSecret: ""
  secretKey: database-url
  storage: 10Gi
  storageClass: ""

web:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

poller:
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: votemanager.local
  tls: []
