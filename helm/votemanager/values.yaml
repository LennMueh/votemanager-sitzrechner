image:
  repository: ghcr.io/lennmueh/votemanager
  tag: latest
  # Digest gewinnt gegen tag; wird aus der Job-Summary des Image-Workflows gesetzt.
  digest: ""
  pullPolicy: IfNotPresent

metrics:
  serviceMonitor:
    # Braucht die Prometheus-Operator-CRD; ohne Operator auf false setzen.
    enabled: true
    interval: 30s
    labels: {}

crawler:
  contact: ""
  backfill: false

database:
  bundled: true
  name: votemanager
  user: votemanager
  # Nur noetig, wenn bundled=true UND kein existingSecret gesetzt ist.
  password: ""
  # Gesetzt: Chart erzeugt kein eigenes Secret, sondern liest dieses. Gilt auch
  # bei bundled=true; das Secret muss dann beide Keys tragen: den Key aus
  # secretKey (Verbindungs-URL) und postgres-password fuer den DB-Container.
  existingSecret: ""
  secretKey: database-url
  storage: 10Gi
  storageClass: ""
  # Verbindungen je Web-Pod (DATABASE_POOL_SIZE). Mal replicas ist das die Last
  # auf max_connections von PostgreSQL (Standard 100): bei 10 und zwei Repliken
  # 20, bei sechs Repliken 60 plus Poller. Wer web hochskaliert, muss diesen Wert
  # im Blick behalten — deshalb steht er hier und nicht nur im Code.
  poolSize: 10
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    # 1500m statt 1: PostgreSQL lief mit 0,9 von 1 Kern am Deckel und wurde zu
    # 18 % gedrosselt. Es ist der Engpass der Anwendung, nicht die Web-Schicht.
    limits: { cpu: "1500m", memory: 1Gi }

web:
  # Zwei Repliken reichen: über sechs Stunden gemessen brauchten beide zusammen
  # nie mehr als 0,23 Kerne. Mehr Repliken verteilen die Last ohnehin nur
  # begrenzt — jeder Browser hält eine dauerhafte SSE-Verbindung, und die bleibt
  # für ihre ganze Sitzung auf demselben Pod. Vor einem Wahlabend hochsetzen,
  # dann aber database.poolSize gegen max_connections gegenrechnen.
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    # 1 statt 500m: gegen eine Spitze auf einem angehefteten Pod hilft nur ein
    # höheres Limit pro Pod. Bei 500m wurde ein Pod zu 41 % gedrosselt, während
    # der andere bei null lag.
    limits: { cpu: "1", memory: 512Mi }

poller:
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: votemanager.local
  tls: []

# Impressum und Datenschutzerklärung als Markdown (impressum.md,
# datenschutz.md) aus einer ConfigMap, die das Chart NICHT erzeugt: die Texte
# enthalten die ladungsfähige Anschrift nach § 5 DDG und gehören deshalb nicht
# in dieses öffentliche Repo. Der Betreiber legt die ConfigMap selbst an und
# trägt ihren Namen hier ein; ohne sie zeigen /impressum und /datenschutz einen
# sichtbaren Hinweis, dass der Text fehlt.
rechtstexte:
  enabled: false
  configMap: ""
