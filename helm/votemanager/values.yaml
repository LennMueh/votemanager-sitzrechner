image:
  repository: votemanager-ausgabe
  tag: latest
  pullPolicy: IfNotPresent

crawler:
  contact: ""
  backfill: false

database:
  bundled: true
  name: votemanager
  user: votemanager
  password: ""
  existingSecret: ""
  secretKey: database-url
  storage: 10Gi
  storageClass: ""

web:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

poller:
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: votemanager.local
  tls: []
